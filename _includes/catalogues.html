<div class="cat-container">
  {% for gal in site.data.catalogues %}
    <div class="cat-card">
      {% if gal.image and gal.image != "" %}
        <img class="cat-image" src="{{ gal.image | relative_url }}" alt="JWST image of {{ gal.galaxy }}">
      {% else %}
        <div class="cat-image cat-image--empty">Image coming soon</div>
      {% endif %}
      <div class="cat-body">
        <h3>{{ gal.galaxy }}</h3>
        {% for pop in gal.populations %}
          <div class="cat-pop">
            <div class="cat-pop-text">
              <strong>{{ pop.name }}</strong>
              <p>{{ pop.description }}</p>
            </div>
            <a class="btn btn--primary btn--small" href="{{ pop.file | relative_url }}" download>Download</a>
          </div>
        {% endfor %}
      </div>
    </div>
  {% endfor %}
</div>

<style>
.cat-container {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr));
  gap: 2rem;
  margin: 2rem auto;
  padding: 0 1rem;
  max-width: 1100px;
  box-sizing: border-box;
}
.cat-card {
  background: white;
  border-radius: 8px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.cat-image {
  width: 100%;
  height: 200px;
  object-fit: cover;
  display: block;
}
.cat-image--empty {
  display: flex;
  align-items: center;
  justify-content: center;
  background: #2b2e36;
  color: #bbb;
  font-size: 0.9rem;
}
.cat-body {
  padding: 1.2rem 1.5rem 1.5rem;
}
.cat-body h3 {
  margin: 0 0 0.6rem;
  color: #222;
  font-weight: 600;
}
.cat-pop {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  border-top: 1px solid #eee;
  padding-top: 0.8rem;
  margin-top: 0.8rem;
}
.cat-pop-text {
  color: #333;
  font-size: 0.85rem;
}
.cat-card .cat-pop-text p {
  margin: 0.2rem 0 0;
  font-size: 0.8rem;
  color: #555;
}
.cat-pop .btn {
  flex-shrink: 0;
}
</style>
